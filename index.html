<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cyber Hack: Terminal Matrix</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #020205;
      color: #00ff66;
      font-family: 'Courier New', Courier, monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
    }

    /* CRT Monitor Overlay */
    body::before {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      z-index: 100;
      background-size: 100% 4px, 6px 100%;
      pointer-events: none;
    }

    .terminal-container {
      position: relative;
      width: 100%;
      max-width: 550px;
      background: rgba(4, 12, 8, 0.95);
      border: 2px solid #00ff66;
      border-radius: 8px;
      box-shadow: 0 0 20px rgba(0, 255, 102, 0.25);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px dashed #00ff66;
      padding-bottom: 8px;
      font-size: 0.85rem;
    }

    .timer-alert {
      color: #ff0055;
      text-shadow: 0 0 8px #ff0055;
      font-weight: bold;
    }

    .target-container {
      background: rgba(0, 255, 102, 0.05);
      border: 1px solid rgba(0, 255, 102, 0.3);
      padding: 10px;
      border-radius: 4px;
      text-align: center;
    }

    .target-title {
      font-size: 0.75rem;
      color: #aaa;
      margin-bottom: 6px;
      letter-spacing: 1px;
    }

    .sequence-slots {
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    .slot {
      width: 32px;
      height: 32px;
      border: 1px solid #00ff66;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.9rem;
      background: rgba(0, 0, 0, 0.6);
    }

    .slot.matched {
      background: #00ff66;
      color: #020205;
      box-shadow: 0 0 10px #00ff66;
    }

    /* Matrix Area */
    .matrix-wrapper {
      display: flex;
      gap: 15px;
      margin: 8px 0;
    }

    .matrix-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      flex: 2;
    }

    .matrix-cell {
      height: 40px;
      border: 1px solid rgba(0, 255, 102, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.15s ease;
      background: rgba(0, 20, 10, 0.4);
    }

    .matrix-cell:hover {
      border-color: #00ff66;
      background: rgba(0, 255, 102, 0.2);
    }

    .matrix-cell.active-row, .matrix-cell.active-col {
      border-color: #00f0ff;
      background: rgba(0, 240, 255, 0.1);
    }

    .matrix-cell.selected {
      visibility: hidden;
    }

    .buffer-column {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
      border-left: 1px solid rgba(0, 255, 102, 0.2);
      padding-left: 12px;
    }

    .buffer-title {
      font-size: 0.7rem;
      color: #aaa;
      margin-bottom: 4px;
    }

    .buffer-slot {
      height: 30px;
      border: 1px dashed rgba(0, 255, 102, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
    }

    .buffer-slot.filled {
      border-style: solid;
      border-color: #00ff66;
      color: #00ff66;
      background: rgba(0, 255, 102, 0.1);
    }

    /* System Status Log */
    .terminal-log {
      height: 45px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(0, 255, 102, 0.3);
      padding: 6px 10px;
      font-size: 0.75rem;
      color: #888;
      overflow-y: hidden;
      display: flex;
      flex-direction: column-reverse;
    }

    .log-alert { color: #ff0055; }
    .log-success { color: #00ff66; }

    /* Overlay Screens */
    .overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(2, 4, 3, 0.95);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      border-radius: 8px;
      z-index: 50;
    }

    .overlay h1 {
      font-size: 1.8rem;
      color: #00ff66;
      text-shadow: 0 0 10px #00ff66;
      margin-bottom: 10px;
    }

    .btn {
      background: transparent;
      color: #00ff66;
      border: 1px solid #00ff66;
      padding: 8px 20px;
      font-family: inherit;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 15px;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: #00ff66;
      color: #020205;
      box-shadow: 0 0 15px #00ff66;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="terminal-container">
    <div class="header-bar">
      <div>NODE: <span id="nodeId">SYS_8802</span></div>
      <div>BREACH TIME: <span id="timerText" class="timer-alert">30</span>s</div>
      <div>SCORE: <span id="scoreText">0</span></div>
    </div>

    <div class="target-container">
      <div class="target-title">// REQUIRED CODE SEQUENCE</div>
      <div class="sequence-slots" id="targetSlots"></div>
    </div>

    <div class="matrix-wrapper">
      <div class="matrix-grid" id="matrixGrid"></div>
      <div class="buffer-column">
        <div class="buffer-title">BUFFER</div>
        <div id="bufferSlots"></div>
      </div>
    </div>

    <div class="terminal-log" id="terminalLog">
      <div>[SYSTEM READY] Initialize sequence extraction.</div>
    </div>

    <div id="startScreen" class="overlay">
      <h1>TERMINAL MATRIX</h1>
      <p style="color:#aaa; font-size:0.8rem; max-width: 350px;">
        Locate the required code sequence within the memory matrix. Alternating row/column locks apply per selection.
      </p>
      <button class="btn" onclick="startGame()">Initiate Breach</button>
    </div>

    <div id="gameOverScreen" class="overlay hidden">
      <h1 id="overTitle" style="color:#ff0055; text-shadow: 0 0 10px #ff0055;">FIREWALL LOCKOUT</h1>
      <p id="overText" style="color:#aaa; font-size:0.85rem; margin-top: 8px;"></p>
      <button class="btn" onclick="startGame()">Retry Access</button>
    </div>
  </div>

  <script>
    const hexValues = ['E9', '7A', '1C', '55', 'BD', 'FF'];
    const gridSize = 5;
    const maxBuffer = 6;

    let matrix = [];
    let targetSequence = [];
    let userBuffer = [];
    let currentRow = 0;
    let isRowSelection = true; // Alternates between Row and Column locks
    
    let score = 0;
    let timeLeft = 30;
    let timerInterval = null;
    let gameRunning = false;

    const matrixGrid = document.getElementById('matrixGrid');
    const targetSlots = document.getElementById('targetSlots');
    const bufferSlots = document.getElementById('bufferSlots');
    const timerText = document.getElementById('timerText');
    const scoreText = document.getElementById('scoreText');
    const terminalLog = document.getElementById('terminalLog');

    const startScreen = document.getElementById('startScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const overTitle = document.getElementById('overTitle');
    const overText = document.getElementById('overText');

    function logMsg(msg, cssClass = '') {
      const entry = document.createElement('div');
      if (cssClass) entry.className = cssClass;
      entry.innerText = `> ${msg}`;
      terminalLog.insertBefore(entry, terminalLog.firstChild);
    }

    function generatePuzzle() {
      // Build 5x5 Matrix
      matrix = [];
      for (let r = 0; r < gridSize; r++) {
        let row = [];
        for (let c = 0; c < gridSize; c++) {
          row.push(hexValues[Math.floor(Math.random() * hexValues.length)]);
        }
        matrix.push(row);
      }

      // Generate solvable 3-length target sequence
      targetSequence = [];
      let tempR = 0;
      let tempC = Math.floor(Math.random() * gridSize);
      targetSequence.push(matrix[tempR][tempC]);

      for (let i = 0; i < 2; i++) {
        tempR = Math.floor(Math.random() * gridSize);
        targetSequence.push(matrix[tempR][tempC]);
      }

      userBuffer = [];
      currentRow = 0;
      isRowSelection = true;

      renderGrid();
      renderTargets();
      renderBuffer();
    }

    function renderTargets() {
      targetSlots.innerHTML = '';
      targetSequence.forEach((val) => {
        const slot = document.createElement('div');
        slot.className = 'slot';
        slot.innerText = val;
        targetSlots.appendChild(slot);
      });
    }

    function renderBuffer() {
      bufferSlots.innerHTML = '';
      for (let i = 0; i < maxBuffer; i++) {
        const slot = document.createElement('div');
        slot.className = `buffer-slot ${userBuffer[i] ? 'filled' : ''}`;
        slot.innerText = userBuffer[i] || '';
        bufferSlots.appendChild(slot);
      }
    }

    function renderGrid() {
      matrixGrid.innerHTML = '';
      for (let r = 0; r < gridSize; r++) {
        for (let c = 0; c < gridSize; c++) {
          const cell = document.createElement('div');
          cell.className = 'matrix-cell';
          cell.innerText = matrix[r][c];

          // Active row/column highlights
          if (isRowSelection && r === currentRow) {
            cell.classList.add('active-row');
          } else if (!isRowSelection && c === currentRow) {
            cell.classList.add('active-col');
          }

          cell.onclick = () => selectCell(r, c);
          matrixGrid.appendChild(cell);
        }
      }
    }

    function selectCell(r, c) {
      if (!gameRunning) return;

      // Validate lock constraints
      if (isRowSelection && r !== currentRow) {
        logMsg('ACCESS DENIED: Row lock enforced.', 'log-alert');
        return;
      }
      if (!isRowSelection && c !== currentRow) {
        logMsg('ACCESS DENIED: Column lock enforced.', 'log-alert');
        return;
      }

      const selectedValue = matrix[r][c];
      userBuffer.push(selectedValue);
      
      logMsg(`Extracted [${selectedValue}]`);

      // Alternate selection lock
      isRowSelection = !isRowSelection;
      currentRow = isRowSelection ? r : c;

      renderBuffer();
      renderGrid();
      checkWinCondition();
    }

    function checkWinCondition() {
      // Check if target sequence exists anywhere in user buffer
      const bufferStr = userBuffer.join('');
      const targetStr = targetSequence.join('');

      if (bufferStr.includes(targetStr)) {
        score += 100 + timeLeft * 10;
        scoreText.innerText = score;
        logMsg('BREACH SUCCESSFUL! Advancing node...', 'log-success');
        timeLeft += 10; // Bonus time
        generatePuzzle();
        return;
      }

      if (userBuffer.length >= maxBuffer) {
        endGame(false, 'Buffer full. Firewall locked down node.');
      }
    }

    function startGame() {
      score = 0;
      timeLeft = 30;
      scoreText.innerText = score;
      timerText.innerText = timeLeft;
      gameRunning = true;

      startScreen.classList.add('hidden');
      gameOverScreen.classList.add('hidden');
      terminalLog.innerHTML = '';

      generatePuzzle();

      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timeLeft--;
        timerText.innerText = timeLeft;
        if (timeLeft <= 0) {
          endGame(false, 'Time limit expired. System purged.');
        }
      }, 1000);
    }

    function endGame(win, reason) {
      gameRunning = false;
      clearInterval(timerInterval);

      overTitle.innerText = win ? 'SYSTEM OVERRIDDEN' : 'ACCESS DENIED';
      overTitle.style.color = win ? '#00ff66' : '#ff0055';
      overTitle.style.textShadow = win ? '0 0 10px #00ff66' : '0 0 10px #ff0055';

      overText.innerHTML = `${reason}<br><br>Final Score: <b>${score}</b>`;
      gameOverScreen.classList.remove('hidden');
    }
  </script>
</body>
</html>
